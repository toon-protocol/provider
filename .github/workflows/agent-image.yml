name: Agent image

# Minimal build-only check for the sandcastle agent container image.
# Proves the `.sandcastle/Dockerfile` (node:22-bookworm + gh + Claude Code CLI +
# the mattpocock-skills plugin + Rust + envsubst) builds, and that the toolchain the
# gate needs is really in it. This is not the runner itself; that is agent-implement.yml.

on:
  pull_request:
    paths:
      - '.sandcastle/**'
      - '.github/workflows/agent-image.yml'
  workflow_dispatch:

jobs:
  build-image:
    name: Build sandcastle agent image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      # Docker is preinstalled on ubuntu-latest GitHub-hosted runners.
      # `sandcastle docker build-image` builds .sandcastle/Dockerfile,
      # defaulting the AGENT_UID/AGENT_GID build args to the runner's uid/gid.
      - name: Build agent image
        run: npx --yes @ai-hero/sandcastle@0.12.0 docker build-image

      - name: Verify toolchain inside image
        run: |
          docker run --rm --entrypoint bash sandcastle:provider -lc '
            set -e
            node --version
            npm --version
            gh --version | head -1
            test "$(whoami)" = "agent"
            test -x /home/agent/.local/bin/claude
            # The runner starts every session with a mattpocock-skills slash command.
            # The `-lc` above is a LOGIN shell on purpose: it sources /etc/profile and
            # rebuilds PATH from scratch, the strictest of the two shell modes this
            # container sees.
            claude plugin list | grep -q mattpocock-skills
            rustc --version
            cargo --version
            cargo clippy --version
            cargo fmt --version
            # tests/deploy_bundle.rs runs the real deploy/render.sh.
            command -v envsubst
          '

      # The end-to-end claim: an agent in this container can build and run this
      # repository's own gate. Binaries existing is not the same as the tests passing
      # inside the sandbox (no Docker daemon, uid 1001, a bind-mounted workspace), and
      # a settlement-style ticket would otherwise find that out from a failed run.
      # `--lib` keeps it to the unit tests: the full gate is what the runner runs.
      - name: Verify the agent can build and test this repository
        run: |
          docker run --rm \
            -v "$PWD":/home/agent/workspace -w /home/agent/workspace \
            --entrypoint bash sandcastle:provider -lc '
              set -euo pipefail
              cargo test --locked --lib 2>&1 | tee /tmp/test.log
              grep -q "test result: ok" /tmp/test.log
              cargo test --locked --test deploy_bundle 2>&1 | tee /tmp/bundle.log
              grep -q "test result: ok" /tmp/bundle.log
            '

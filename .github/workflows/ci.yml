name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Keeps file:line in backtraces without the rest of the debug info —
  # much less linking across the test binaries.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  checks:
    name: Format, test and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      # --all-targets is deliberately absent: it silently drops doc tests.
      # The Docker integration tests are #[ignore] and do not run here.
      # This includes `--test wire_fixtures`, which verifies every file under
      # tests/fixtures/wire/ byte-for-byte against the code (TOON_Network #16);
      # the spec repository's copy is synced by hand (README, "Wire fixtures").
      - run: cargo test --locked --no-fail-fast
      - run: cargo clippy --locked --all-targets -- -D warnings

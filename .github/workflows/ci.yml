name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Keeps file:line in backtraces without the rest of the debug info —
  # much less linking across the test binaries.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  checks:
    name: Format, test and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Deliberately still `@stable`, not a pin to the Dockerfile's 1.85 — see
      # "Why not a rust-toolchain.toml" in the PR description. Short version:
      # a repo-wide pin to 1.85 broke `cargo test` here, because the dev-only
      # `wiremock` dependency needs a newer Rust than the image ever needs to
      # ship. The `docker-build` job below is the actual guard against
      # TOON_Network#79 recurring: it compiles the same `--bin toon-provider`
      # the Dockerfile ships, inside the same pinned image, on every PR.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      # --all-targets is deliberately absent: it silently drops doc tests.
      # The Docker integration tests are #[ignore] and do not run here.
      # This includes `--test wire_fixtures`, which verifies every file under
      # tests/fixtures/wire/ byte-for-byte against the code (TOON_Network #16);
      # the spec repository's copy is synced by hand (README, "Wire fixtures").
      - run: cargo test --locked --no-fail-fast
      - run: cargo clippy --locked --all-targets -- -D warnings

  docker-build:
    name: Build provider image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Not pushed: no registry write, no `packages: write` permission. This
      # job's job is to prove the image still builds on the pinned toolchain,
      # the way `provider/Dockerfile` is actually built for the sandbox and
      # the fleet — see the PR description for the publish question.
      - name: Build provider image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: toon-provider:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

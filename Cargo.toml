[package]
name = "toon-provider"
version = "0.1.0"
edition = "2021"
description = "Sell leases on workloads over the TOON Network"
license = "Apache-2.0"
readme = "README.md"
keywords = ["toon", "compute", "marketplace", "nostr", "lease"]
categories = ["network-programming"]

[lib]
name = "toon_provider"
path = "src/lib.rs"

[[bin]]
name = "toon-provider"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.143"
toml = "0.8"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
async-trait = "0.1"

# The provider's Nostr identity. Its key signs what the provider publishes and
# is the identity a Lease Request is addressed to. Nothing DM-related: nip04
# and nip59 went with the DM transport.
nostr-sdk = "0.43"

# HTTP app, behind the provider's own TOON connector.
axum = "0.7"

# Two callers, one client. The provider hands a signed directory event to its
# directory publisher over plain HTTP (`Directory` -> `ConnectorDirectory`),
# and `provider::image_policy` fetches OCI manifests/indexes by digest from
# upstream registries. `rustls-tls` rather than the system OpenSSL: nostr-sdk
# already brings rustls in for its relay sockets, so this adds no second TLS
# stack.
# `socks` is what a Hidden Provider's own outbound rides (spec §10): with
# `hidden = true` every HTTP client here is built with
# `Proxy::all("socks5h://…")`, so the gateway, the registry, the anonymous
# token exchange and the publish request leave through `anon` and every name
# is resolved by the proxy rather than by this host's resolver.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
# The URL type reqwest already speaks, named directly so the config gate can
# tell an IP-literal host from a name (`url::Host`) without re-parsing it.
url = "2"

clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Digesting the manifest bytes the image policy fetched, to verify them
# against the digest the tenant named, and deriving a Continuation Token from
# a tenant's root secret (spec §6.1, ADR 0016).
sha2 = "0.10"
hkdf = "0.12"

# Comparing a presented Continuation Token against the stored one without
# leaking the stored value through how long the comparison took (spec §6.1).
subtle = "2"
bytes = "1"

# Writing the OCI image layout a Docker backend loads verified blobs from
# (spec §8.4): one tar of `oci-layout`, `index.json` and `blobs/sha256/…`,
# streamed straight out of the blob cache.
tar = "0.4"

# `toon-provider redeem` (TOON_Network#173) signs the connector's
# `POST /channels/:id/redeem-latest` exactly as `connector send` does: an
# RFC 9421 ed25519 signature over `@method`, `@path` and an RFC 9530
# `Content-Digest`. ed25519-dalek is the implementation the connector itself
# verifies with (it is on 1.x; 2.x signs the same RFC 8032 bytes), and its
# `SigningKey` wipes itself on drop — `ring`, already in the tree through
# rustls, signs ed25519 too but leaves its expanded key in freed memory.
# `zeroize` and `base64` are already in the tree (rustls, reqwest); they are
# named here to wipe the key text read from stdin and to encode the headers.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
zeroize = "1"
base64 = "0.22"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
proptest = "1"
rand = "0.8"
tempfile = "3"

# Stubs upstream OCI registries in image policy tests (prior art: Paygress
# `tests/blossom.rs`).
wiremock = "0.6"

# Stubs a NIP-01 relay in the relay-backed Directory's tests
# (`tests/common/relay.rs`): the same websocket stack nostr-sdk connects
# with, on the server side, so no second one is pulled in.
tokio-tungstenite = "0.26"
futures-util = "0.3"

[profile.release]
# Optimize for small binary size
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

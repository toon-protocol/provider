[package]
name = "toon-provider"
version = "0.1.0"
edition = "2021"
description = "Sell leases on workloads over the TOON Network"
license = "Apache-2.0"
readme = "README.md"
keywords = ["toon", "compute", "marketplace", "nostr", "lease"]
categories = ["network-programming"]

[lib]
name = "toon_provider"
path = "src/lib.rs"

[[bin]]
name = "toon-provider"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.143"
toml = "0.8"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
async-trait = "0.1"

# The provider's Nostr identity. Its key signs what the provider publishes and
# is the identity a Lease Request is addressed to. Nothing DM-related: nip04
# and nip59 went with the DM transport.
nostr-sdk = "0.43"

# HTTP app, behind the provider's own TOON connector.
axum = "0.7"

clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
proptest = "1"
rand = "0.8"
tempfile = "3"

[profile.release]
# Optimize for small binary size
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
